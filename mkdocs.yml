site_name: Inexact Computing Learning & Research Portal
site_description: Open-access knowledge portal, literature taxonomy, and arithmetic benchmarks for approximate and inexact computing.
site_author: SJTU Yongfu Research Group
site_url: https://inexact-computing.github.io/inexact-learn-public/

repo_name: SJTU-YONGFU-RESEARCH-GRP/inexact-computing-lab
repo_url: https://github.com/SJTU-YONGFU-RESEARCH-GRP/inexact-computing-lab

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Glossary: glossary.md
  - Fundamentals:
      - Error Metrics & Bounds: fundamentals/error-metrics.md
      - Approximation Paradigms: fundamentals/approx-paradigms.md
  - Architecture Taxonomy:
      - Approximate Multipliers: taxonomy/multipliers.md
      - Approximate Adders: taxonomy/adders.md
      - Approximate CORDIC: taxonomy/cordic.md
  - Catalog & Benchmarks:
      - Literature Catalog: benchmarks/catalog.md
      - DSE & Pareto Frontiers: benchmarks/dse-pareto.md
