site_name: Inexact Computing Learning & Research Portal
site_description: High-school friendly, open-access living laboratory and interactive educational portal for approximate and inexact arithmetic computing.
site_author: SJTU Yongfu Research Group
site_url: https://inexact-computing.github.io/public/
copyright: Prepared by Yongfu Li and research group

repo_name: Inexact-Computing/public
repo_url: https://github.com/Inexact-Computing/public

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra:
  generator: false

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/vendor/katex/katex.min.css
  - stylesheets/math.css

extra_javascript:
  - javascripts/vendor/katex/katex.min.js
  - javascripts/katex.js

nav:
  - Home: index.md
  - Glossary: glossary.md
  - 🎓 Fundamentals:
      - Why Inexact Computing?: fundamentals/why-approximate-computing.md
      - Error Metrics Made Easy: fundamentals/error-metrics-made-easy.md
      - Mathematical Error Bounds: fundamentals/error-metrics.md
      - Approximation Paradigms: fundamentals/approx-paradigms.md
  - 🌉 Bridge to Real World:
      - Human Eyes & Pixel Noise: bridge/human-eyes-and-pixels.md
      - Why AI Loves Inexact Math: bridge/ai-and-approximate-math.md
  - ⚙️ Circuit Taxonomies:
      - Approximate Multipliers: taxonomy/multipliers.md
      - Approximate Adders: taxonomy/adders.md
      - Approximate CORDIC: taxonomy/cordic.md
