<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="alwann-title alwann-desc" font-family="Arial, Helvetica, sans-serif">
<title id="alwann-title">ALWANN Table III: CIFAR-10 top-1 accuracy versus relative convolution-layer multiplication energy for AxResNet-8, AxResNet-14 and AxResNet-50</title>
<desc id="alwann-desc">Three separate panels, one per network, plotting all 18 rows of Table III of Mrazek et al., ALWANN, ICCAD 2019: for each network its 8-bit quantized (qint8) model at 100 percent and the selected approximate configurations. The horizontal axis of each panel is the energy of multiplications in convolutional layers relative to that network's own qint8 model, estimated from 45 nm Synopsys DC multiplier energies with uniform inputs; it does not compare absolute energy between networks. Vertical scales differ between panels. Points are not joined. Values are listed under each panel and in alwann-points.csv.</desc>
<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<text x="480" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ALWANN (ICCAD 2019) Table III, CIFAR-10: accuracy vs. relative energy of convolution multiplications</text>
<text x="480" y="46" text-anchor="middle" font-size="12" fill="#444">Each panel is normalized to its own 8-bit quantized network (= 100 %). Do not compare horizontal positions across panels.</text>
